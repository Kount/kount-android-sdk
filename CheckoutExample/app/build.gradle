apply plugin: 'com.android.application'
apply plugin: 'maven-publish'

// Version name properties file reader
def versionPropertiesFile = new File(rootProject.projectDir, "version.properties")
def versionProperties = new Properties()
versionPropertiesFile.withReader("UTF-8") { reader -> versionProperties.load(reader) }
def version_name = versionProperties.getProperty("version.name")

// Detect distribution source (jitpack or github)
def detectDistributionSource = {
    // Check if building on JitPack (JitPack sets specific environment variables)
    def isJitPack = System.getenv('JITPACK') == 'true' || 
                    project.hasProperty('jitpack') ||
                    System.getenv('BUILD_NUMBER') != null // Common CI/CD indicator
    
    return isJitPack ? 'jitpack' : 'github'
}

def distributionSource = detectDistributionSource()

// Log distribution source detection
println "\n🎯 DETECTED BUILD ENVIRONMENT: ${distributionSource.toUpperCase()}"
if (System.getenv('JITPACK') == 'true') {
    println "   (JitPack build detected: JITPACK=true)"
} else if (System.getenv('BUILD_NUMBER') != null) {
    println "   (CI/CD environment detected: BUILD_NUMBER set)"
} else {
    println "   (Local/GitHub build)"
}
println ""

android {
    compileSdkVersion 34
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "com.kount.checkoutexample"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        
        // Add distribution source as buildConfigField - automatically passed to SDK
        buildConfigField "String", "DISTRIBUTION_SOURCE", "\"${distributionSource}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // Resource filtering to inject distribution source into properties file
    sourceSets {
        main {
            resources {
                srcDir 'src/main/res/raw'
            }
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Task to inject distribution metadata into the SDK jar
task injectDistributionMetadata {
    doFirst {
        def jarDir = file('../../KountDataCollector')
        def jarFile = fileTree(dir: jarDir, include: '*.jar').singleFile
        
        if (!jarFile.exists()) {
            println "⚠️  WARNING: SDK jar not found at ${jarFile}"
            return
        }
        
        println "\n" + "="*80
        println "🔧 KOUNT SDK - DISTRIBUTION SOURCE IDENTIFICATION"
        println "="*80
        
        def timestamp = System.currentTimeMillis()
        def buildDir = file('build/tmp/distribution-injection')
        def extractDir = new File(buildDir, 'extracted')
        
        // Clean and create directories
        buildDir.deleteDir()
        buildDir.mkdirs()
        extractDir.mkdirs()
        
        println "📦 JAR Location: ${jarFile.absolutePath}"
        println "📍 Processing: ${jarFile.name}"
        
        // Extract jar
        copy {
            from zipTree(jarFile)
            into extractDir
        }
        
        println "✓ Extracted JAR successfully"
        
        // Create distribution properties file at the jar root (read at runtime via
        // Class.getResourceAsStream("/distribution.properties") by DistributionSource.kt)
        def distributionProps = new File(extractDir, 'distribution.properties')
        distributionProps.text = """# Kount Data Collector - Distribution Source Identification
# Auto-generated during build

distribution.source=${distributionSource}
distribution.version=${version_name}
build.timestamp=${timestamp}
build.gradle.version=${gradle.gradleVersion}
build.os=${System.getProperty('os.name')}
"""
        
        println "📝 Created distribution.properties:"
        println "   distribution.source = ${distributionSource}"
        println "   distribution.version = ${version_name}"
        println "   build.timestamp = ${timestamp}"
        println "   build.gradle.version = ${gradle.gradleVersion}"
        println "   build.os = ${System.getProperty('os.name')}"
        
        // Recreate jar with distribution metadata
        println "📦 Repackaging JAR with distribution metadata..."
        
        // Create temporary backup for safety during repackaging
        def tempBackupDir = new File(buildDir, 'original-backup')
        tempBackupDir.mkdirs()
        def tempBackup = new File(tempBackupDir, jarFile.name)
        jarFile.renameTo(tempBackup)
        
        try {
            // Recreate jar with distribution metadata
            ant.jar(destfile: jarFile.absolutePath, basedir: extractDir.absolutePath)
            
            println "✅ SUCCESS: Distribution metadata injected into SDK"
            println "   Source Type: ${distributionSource.toUpperCase()}"
            println "   SDK Version: ${version_name}"
            println "   Jar File: ${jarFile.name}"
            println "="*80 + "\n"
        } catch (Exception e) {
            // If something fails, restore from backup
            if (tempBackup.exists()) {
                tempBackup.renameTo(jarFile)
                println "⚠️  ERROR: Failed to repackage. Restored from backup."
            }
            throw e
        }
    }
}

// Task to process distribution configuration file before build
task processDistributionConfig {
    doFirst {
        def configFile = file('src/main/res/raw/distribution_config.properties')
        if (configFile.exists()) {
            def content = configFile.text
            def timestamp = System.currentTimeMillis()
            
            // Replace template variables
            content = content.replace('${DISTRIBUTION_SOURCE}', distributionSource)
            content = content.replace('${BUILD_TIMESTAMP}', timestamp.toString())
            
            configFile.text = content
            println "\n📋 Distribution Config File Updated:"
            println "   File: distribution_config.properties"
            println "   Source: ${distributionSource}"
            println "   Timestamp: ${timestamp}\n"
        }
    }
}

// Hook tasks to run before preBuild
preBuild.dependsOn injectDistributionMetadata, processDistributionConfig

// publish* tasks don't depend on preBuild, so without this, JitPack (which only
// runs the publish task) would ship the jar with whatever distribution.properties
// is already checked into git, ignoring the JITPACK env var entirely.
tasks.matching { it.name.startsWith("publish") || it.name.startsWith("generatePomFile") }.configureEach {
    dependsOn injectDistributionMetadata
}

dependencies {
    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation fileTree(dir: '../../KountDataCollector', include: ['*.jar'])
    testImplementation 'junit:junit:4.13'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.instantapps:instantapps:1.1.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.android.gms:play-services-base:18.0.1'
    implementation group: 'com.android.volley', name: 'volley', version: '1.2.1'
    implementation "com.google.android.material:material:1.4.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

}

repositories {
    mavenCentral()
    google()
    maven { url "https://jitpack.io" }
}

String VERSION_NAME = version_name
String GROUP_ID = "com.kount"
String ARTIFACT_ID = "datacollector"

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId GROUP_ID
                artifactId = ARTIFACT_ID
                version = VERSION_NAME.replace('v','')

                artifact('../../KountDataCollector/kount-data-collector-' + VERSION_NAME.replace('v','') + '.jar')

                pom.withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')
                    configurations["implementation"].allDependencies.each {
                        if (it.name!='unspecified') {
                            def dependencyNode = dependenciesNode.appendNode('dependency')
                            dependencyNode.appendNode('groupId', it.group)
                            dependencyNode.appendNode('artifactId', it.name)
                            dependencyNode.appendNode('version', it.version)
                        }
                    }
                }
            }

        }
    }

}

task getVersionNameTest(){
   doFirst{
       println "version_name: " + version_name
       println "VERSION_NAME: " + VERSION_NAME
   }
}
